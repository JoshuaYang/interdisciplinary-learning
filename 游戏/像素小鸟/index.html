<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>像素小鸟 - Flappy Bird</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #1a1a24;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 4px #2b2b3a;
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #70c5ce;
    }
    .tips {
      position: absolute;
      bottom: -32px;
      width: 100%;
      text-align: center;
      color: #889;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="320" height="480"></canvas>
  </div>

  <script>
    // --- 音效合成器 (Web Audio API，免去外部资源依赖) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playJump() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playScore() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playHit() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      }
      playDie() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const sfx = new SoundFX();

    // --- 游戏主程序 ---
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;
    const GROUND_Y = H - 70;

    let frames = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
    let shakeTimer = 0;
    let flashAlpha = 0;

    // 背景云朵
    const clouds = [
      { x: 30, y: 50, speed: 0.2, w: 55, h: 22 },
      { x: 150, y: 80, speed: 0.15, w: 45, h: 18 },
      { x: 260, y: 40, speed: 0.25, w: 60, h: 24 }
    ];

    // 背景山丘
    const hills = [
      { x: 0, r: 60, y: GROUND_Y },
      { x: 100, r: 90, y: GROUND_Y },
      { x: 220, r: 70, y: GROUND_Y },
      { x: 310, r: 85, y: GROUND_Y }
    ];

    // 小鸟
    const bird = {
      x: 70,
      y: 220,
      radius: 12,
      velocity: 0,
      gravity: 0.28,
      jumpStrength: -5.8,
      rotation: 0,
      wingFrame: 0,
      wingTimer: 0,

      reset() {
        this.y = 220;
        this.velocity = 0;
        this.rotation = 0;
        this.wingFrame = 0;
        this.wingTimer = 0;
      },

      jump() {
        this.velocity = this.jumpStrength;
        sfx.playJump();
      },

      update() {
        this.wingTimer++;
        if (this.wingTimer % 6 === 0) {
          this.wingFrame = (this.wingFrame + 1) % 4;
        }

        if (gameState === 'START') {
          // 标题界面轻微浮动
          this.y = 220 + Math.sin(frames * 0.08) * 6;
          this.rotation = 0;
          return;
        }

        this.velocity += this.gravity;
        this.y += this.velocity;

        // 旋转角度模拟
        if (this.velocity < 0) {
          this.rotation = Math.max(-0.45, this.velocity * 0.08);
        } else {
          this.rotation = Math.min(Math.PI / 2, this.velocity * 0.09);
        }

        // 落地检测
        if (this.y + this.radius >= GROUND_Y) {
          this.y = GROUND_Y - this.radius;
          gameOver();
        }
        // 天花板限制
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // 像素小鸟造型
        const wingOffset = [0, -2, 0, 2][this.wingFrame];

        // 鸟身 (金黄)
        ctx.fillStyle = '#f7d028';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 腹部淡黄高光
        ctx.fillStyle = '#fff4a3';
        ctx.beginPath();
        ctx.ellipse(-2, 3, 10, 6, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(6, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 瞳孔
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(8, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        // 鸟嘴 (橙红)
        ctx.fillStyle = '#f05a28';
        ctx.beginPath();
        ctx.moveTo(10, -2);
        ctx.lineTo(20, 2);
        ctx.lineTo(10, 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 翅膀 (白色加阴影)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-6, 1 + wingOffset, 7, 4, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }
    };

    // 管道管理器
    const pipes = {
      items: [],
      gap: 92,
      pipeWidth: 50,
      spawnRate: 110,

      reset() {
        this.items = [];
      },

      update() {
        if (gameState !== 'PLAYING') return;

        if (frames % this.spawnRate === 0) {
          const minH = 45;
          const maxH = GROUND_Y - this.gap - minH;
          const topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
          this.items.push({
            x: W,
            top: topH,
            bottom: GROUND_Y - topH - this.gap,
            passed: false
          });
        }

        for (let i = this.items.length - 1; i >= 0; i--) {
          const p = this.items[i];
          p.x -= 2;

          // 得分检测
          if (!p.passed && p.x + this.pipeWidth < bird.x) {
            p.passed = true;
            score++;
            sfx.playScore();
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('flappy_best', bestScore);
            }
          }

          // 碰撞检测
          const birdBox = {
            left: bird.x - bird.radius + 3,
            right: bird.x + bird.radius - 3,
            top: bird.y - bird.radius + 3,
            bottom: bird.y + bird.radius - 3
          };

          // 上管道
          if (
            birdBox.right > p.x &&
            birdBox.left < p.x + this.pipeWidth &&
            birdBox.top < p.top
          ) {
            gameOver();
          }

          // 下管道
          const bottomY = p.top + this.gap;
          if (
            birdBox.right > p.x &&
            birdBox.left < p.x + this.pipeWidth &&
            birdBox.bottom > bottomY
          ) {
            gameOver();
          }

          // 超出屏幕移除
          if (p.x + this.pipeWidth < -10) {
            this.items.splice(i, 1);
          }
        }
      },

      draw() {
        for (const p of this.items) {
          this.drawSinglePipe(p.x, 0, p.top, true);
          this.drawSinglePipe(p.x, p.top + this.gap, p.bottom, false);
        }
      },

      drawSinglePipe(x, y, h, isTop) {
        ctx.save();
        const capH = 22;
        const capW = this.pipeWidth + 6;
        const capX = x - 3;
        const capY = isTop ? y + h - capH : y;
        const bodyY = isTop ? y : y + capH;
        const bodyH = Math.max(0, h - capH);

        // 管道身
        ctx.fillStyle = '#73be2e';
        ctx.fillRect(x, bodyY, this.pipeWidth, bodyH);

        // 管道高光与暗部
        ctx.fillStyle = '#9ee644';
        ctx.fillRect(x + 4, bodyY, 6, bodyH);
        ctx.fillStyle = '#558a22';
        ctx.fillRect(x + this.pipeWidth - 10, bodyY, 10, bodyH);

        // 管道边框
        ctx.strokeStyle = '#2b4412';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, bodyY, this.pipeWidth, bodyH);

        // 管道盖
        ctx.fillStyle = '#73be2e';
        ctx.fillRect(capX, capY, capW, capH);
        ctx.fillStyle = '#9ee644';
        ctx.fillRect(capX + 4, capY, 6, capH);
        ctx.fillStyle = '#558a22';
        ctx.fillRect(capX + capW - 12, capY, 12, capH);
        ctx.strokeRect(capX, capY, capW, capH);

        ctx.restore();
      }
    };

    // 地面滚动偏移
    let groundX = 0;

    function gameOver() {
      if (gameState === 'GAMEOVER') return;
      gameState = 'GAMEOVER';
      shakeTimer = 12;
      flashAlpha = 0.8;
      sfx.playHit();
      setTimeout(() => sfx.playDie(), 120);
    }

    function resetGame() {
      score = 0;
      pipes.reset();
      bird.reset();
      gameState = 'START';
    }

    function flap() {
      sfx.init();
      if (gameState === 'START') {
        gameState = 'PLAYING';
        bird.jump();
      } else if (gameState === 'PLAYING') {
        bird.jump();
      } else if (gameState === 'GAMEOVER') {
        if (shakeTimer === 0) {
          resetGame();
        }
      }
    }

    // 交互监听
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    // 绘制背景与场景
    function drawEnvironment() {
      // 天空渐变
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, '#4ec0ca');
      skyGrad.addColorStop(1, '#a6f0eb');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, GROUND_Y);

      // 云朵
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      for (const c of clouds) {
        c.x -= c.speed;
        if (c.x + c.w < -10) c.x = W + 20;
        ctx.beginPath();
        ctx.roundRect(c.x, c.y, c.w, c.h, 10);
        ctx.fill();
      }

      // 远景绿丘
      ctx.fillStyle = '#a1df79';
      for (const h of hills) {
        ctx.beginPath();
        ctx.arc(h.x, h.y + 10, h.r, Math.PI, 0, false);
        ctx.fill();
      }

      // 管道
      pipes.draw();

      // 地面
      if (gameState === 'PLAYING' || gameState === 'START') {
        groundX = (groundX - 2) % 18;
      }

      // 地面泥土
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

      // 草地层
      ctx.fillStyle = '#73be2e';
      ctx.fillRect(0, GROUND_Y, W, 14);
      ctx.fillStyle = '#558a22';
      ctx.fillRect(0, GROUND_Y + 11, W, 3);

      // 地面倾斜条纹像素质感
      ctx.fillStyle = '#cfc670';
      for (let x = groundX; x < W + 20; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y + 14);
        ctx.lineTo(x + 9, GROUND_Y + 14);
        ctx.lineTo(x, GROUND_Y + 30);
        ctx.lineTo(x - 9, GROUND_Y + 30);
        ctx.closePath();
        ctx.fill();
      }

      // 分界黑线
      ctx.strokeStyle = '#2b4412';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(W, GROUND_Y);
      ctx.stroke();
    }

    // 绘制像素风格计分板
    function drawHUD() {
      if (gameState === 'PLAYING') {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.font = 'bold 36px "Courier New", sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeText(score, W / 2, 70);
        ctx.fillText(score, W / 2, 70);
        ctx.restore();
      } else if (gameState === 'START') {
        ctx.save();
        ctx.textAlign = 'center';

        // 标题
        ctx.font = '900 32px "Courier New", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#2b4412';
        ctx.lineWidth = 6;
        ctx.strokeText('FLAPPY BIRD', W / 2, 120);
        ctx.fillText('FLAPPY BIRD', W / 2, 120);

        // 提示框
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.roundRect(W / 2 - 95, 290, 190, 50, 8);
        ctx.fill();

        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('点击屏幕 / 空格键 起飞', W / 2, 320);

        ctx.restore();
      } else if (gameState === 'GAMEOVER') {
        ctx.save();
        ctx.textAlign = 'center';

        // 游戏结束文字
        ctx.font = '900 32px "Courier New", sans-serif';
        ctx.fillStyle = '#e74c3c';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.strokeText('GAME OVER', W / 2, 130);
        ctx.fillText('GAME OVER', W / 2, 130);

        // 结算卡片
        const cardX = W / 2 - 110;
        const cardY = 170;
        const cardW = 220;
        const cardH = 130;

        ctx.fillStyle = '#e1d89f';
        ctx.strokeStyle = '#543847';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 8);
        ctx.fill();
        ctx.stroke();

        // 勋章
        let medal = null;
        let medalColor = null;
        if (score >= 40) { medal = '白金'; medalColor = '#e5e4e2'; }
        else if (score >= 20) { medal = '金牌'; medalColor = '#f1c40f'; }
        else if (score >= 10) { medal = '银牌'; medalColor = '#bdc3c7'; }
        else if (score >= 5) { medal = '铜牌'; medalColor = '#d35400'; }

        if (medal) {
          ctx.beginPath();
          ctx.arc(cardX + 45, cardY + 65, 22, 0, Math.PI * 2);
          ctx.fillStyle = medalColor;
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = '#222';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(medal, cardX + 45, cardY + 70);
        } else {
          ctx.fillStyle = '#998';
          ctx.font = '12px sans-serif';
          ctx.fillText('无奖牌', cardX + 45, cardY + 70);
        }

        // 分数
        ctx.textAlign = 'right';
        ctx.fillStyle = '#d35400';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('本次得分', cardX + cardW - 20, cardY + 40);

        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 22px "Courier New", sans-serif';
        ctx.fillText(score, cardX + cardW - 20, cardY + 65);

        ctx.fillStyle = '#d35400';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('最高纪录', cardX + cardW - 20, cardY + 95);

        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 22px "Courier New", sans-serif';
        ctx.fillText(bestScore, cardX + cardW - 20, cardY + 120);

        // 重启按钮提示
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.font = 'bold 16px sans-serif';
        ctx.strokeText('再次点击 / 空格重玩', W / 2, 340);
        ctx.fillText('再次点击 / 空格重玩', W / 2, 340);

        ctx.restore();
      }
    }

    // 主循环
    function loop() {
      frames++;

      // 震屏效果
      ctx.save();
      if (shakeTimer > 0) {
        shakeTimer--;
        const ox = (Math.random() - 0.5) * 8;
        const oy = (Math.random() - 0.5) * 8;
        ctx.translate(ox, oy);
      }

      ctx.clearRect(0, 0, W, H);

      bird.update();
      pipes.update();

      drawEnvironment();
      bird.draw();
      drawHUD();

      // 死亡白光闪烁
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, W, H);
        flashAlpha -= 0.08;
      }

      ctx.restore();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
