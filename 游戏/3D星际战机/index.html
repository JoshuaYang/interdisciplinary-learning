<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON OVERDRIVE 3D - 赛博星际战机</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #030008;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace, system-ui;
      color: #00ffff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
    }
    /* 赛博 HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .hud-box {
      background: rgba(8, 5, 20, 0.7);
      border: 1px solid #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.15);
      border-radius: 4px;
      padding: 12px 20px;
      backdrop-filter: blur(4px);
    }
    .score-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: #ff007f;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 32px;
      font-weight: 900;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }
    .hud-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: auto;
    }
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 2px solid rgba(0, 255, 255, 0.6);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
      transition: width 0.1s, height 0.1s;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: #00ffff;
    }
    .crosshair::before {
      top: 50%; left: -6px; width: 48px; height: 1.5px; transform: translateY(-50%);
    }
    .crosshair::after {
      left: 50%; top: -6px; height: 48px; width: 1.5px; transform: translateX(-50%);
    }
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .bar-container {
      width: 220px;
      margin-top: 6px;
      height: 12px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ffff;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
    }
    .shield-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff007f, #00ffff);
      transition: width 0.2s ease-out;
      box-shadow: 0 0 10px #00ffff;
    }
    .boost-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffe600, #ff5500);
      transition: width 0.1s linear;
      box-shadow: 0 0 10px #ffe600;
    }
    /* 界面弹窗 */
    .menu-card {
      background: rgba(10, 4, 25, 0.92);
      border: 2px solid #00ffff;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(255, 0, 127, 0.3);
      padding: 36px 48px;
      border-radius: 8px;
      text-align: center;
      max-width: 480px;
    }
    h1.title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #00ffff 0%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }
    p.subtitle {
      color: #ff99cc;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(90deg, #ff007f, #b300ff);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      border: none;
      padding: 14px 38px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.9);
      background: linear-gradient(90deg, #00ffff, #0088ff);
      color: #000;
    }
    .keys-guide {
      margin-top: 24px;
      font-size: 12px;
      color: #88a;
      line-height: 1.8;
      text-align: left;
    }
    .keys-guide b {
      color: #00ffff;
    }
    .screen-flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.1s ease-out;
    }
  </style>
  <!-- 引入 Three.js 核心库 (带 CDN 镜像容灾加载) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="flash" class="screen-flash"></div>
  <div class="crosshair" id="crosshair"></div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-box">
        <div class="score-title">SCORE / 得分</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div class="score-title">COMBO / 连击</div>
        <div class="score-val" id="combo" style="color: #ff007f; text-shadow: 0 0 10px #ff007f;">x1</div>
      </div>
    </div>

    <div class="hud-center" id="menu">
      <div class="menu-card">
        <h1 class="title">NEON OVERDRIVE</h1>
        <p class="subtitle">3D 赛博脉冲 · 极限穿梭</p>
        <button class="btn" id="start-btn">开始超速巡航</button>
        <div class="keys-guide">
          🎮 <b>操作说明：</b><br>
          • <b>WASD / 鼠标移动</b>：战机飞行姿态与俯仰倾斜<br>
          • <b>空格 / 鼠标左键</b>：发射高能等离子双重激光<br>
          • <b>Shift / W 保持</b>：引擎超频加速 (曲率推力)<br>
          • 摧毁晶柱/浮游机积累连击，规避强冲击保护护盾！
        </div>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="hud-box">
        <div class="score-title">SHIELD / 护盾完整度</div>
        <div class="bar-container">
          <div class="shield-fill" id="shield-bar"></div>
        </div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div class="score-title">WARP DRIVE / 跃迁充能 (SHIFT)</div>
        <div class="bar-container">
          <div class="boost-fill" id="boost-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 实时 Web Audio 赛博合成器音效与背景音乐
    // ==========================================
    class SynthAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMusicPlaying = false;
        this.step = 0;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playLaser() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playExplode() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // 噪声模拟爆炸
        const bufferSize = this.ctx.sampleRate * 0.35;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, now);
        filter.frequency.linearRampToValueAtTime(80, now + 0.35);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      // 80s 动态合成波低音循环 (自动生成音乐，零外部mp3)
      startSynthwaveMusic() {
        if (this.isMusicPlaying) return;
        this.isMusicPlaying = true;
        const bassNotes = [55, 55, 65.41, 73.42, 55, 55, 82.41, 73.42]; // A1, C2, D2, E2
        const tempoInterval = 140; // ms
        setInterval(() => {
          if (!this.ctx || this.ctx.state !== 'running') return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'sawtooth';
          const freq = bassNotes[this.step % bassNotes.length];
          osc.frequency.setValueAtTime(freq, now);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(500 + Math.sin(this.step * 0.2) * 350, now);
          filter.Q.setValueAtTime(4, now);

          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);

          this.step++;
        }, tempoInterval);
      }
    }

    const audio = new SynthAudioEngine();

    // ==========================================
    // 2. Three.js 场景构建
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050014, 0.008);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // 灯光
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ffff, 1.2);
    dirLight.position.set(5, 15, 10);
    scene.add(dirLight);

    const pinkLight = new THREE.DirectionalLight(0xff007f, 1.5);
    pinkLight.position.set(-5, 10, -20);
    scene.add(pinkLight);

    // 远景落日 (Retro Synthwave Sun)
    const sunGeom = new THREE.CircleGeometry(45, 32);
    const sunMat = new THREE.MeshBasicMaterial({
      color: 0xff0055,
      fog: false,
      side: THREE.DoubleSide
    });
    const sun = new THREE.Mesh(sunGeom, sunMat);
    sun.position.set(0, 20, -220);
    scene.add(sun);

    // 动态霓虹网格地面 (Infinite Scrolling Grid)
    const gridHelper1 = new THREE.GridHelper(400, 80, 0x00ffff, 0xff007f);
    gridHelper1.position.y = -4;
    scene.add(gridHelper1);

    const gridHelper2 = new THREE.GridHelper(400, 80, 0x00ffff, 0xff007f);
    gridHelper2.position.set(0, -4, -400);
    scene.add(gridHelper2);

    // ==========================================
    // 3. 构建炫酷 3D 穿梭战机 (Starfighter)
    // ==========================================
    const shipGroup = new THREE.Group();

    // 机身
    const bodyGeom = new THREE.ConeGeometry(0.8, 3.8, 6);
    bodyGeom.rotateX(Math.PI / 2);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x111118,
      metalness: 0.85,
      roughness: 0.25,
      emissive: 0x002233,
      emissiveIntensity: 0.6
    });
    const shipBody = new THREE.Mesh(bodyGeom, bodyMat);
    shipGroup.add(shipBody);

    // 座舱发光罩
    const cockpitGeom = new THREE.ConeGeometry(0.38, 1.6, 5);
    cockpitGeom.rotateX(Math.PI / 2);
    const cockpitMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const cockpit = new THREE.Mesh(cockpitGeom, cockpitMat);
    cockpit.position.set(0, 0.35, 0.2);
    shipGroup.add(cockpit);

    // 左右后掠翼
    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.lineTo(2.8, -1.2);
    wingShape.lineTo(2.2, -1.8);
    wingShape.lineTo(0, -0.6);
    wingShape.closePath();

    const wingGeom = new THREE.ShapeGeometry(wingShape);
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0x0e0e18,
      metalness: 0.9,
      roughness: 0.2,
      side: THREE.DoubleSide
    });

    const leftWing = new THREE.Mesh(wingGeom, wingMat);
    leftWing.rotation.x = Math.PI / 2;
    leftWing.position.set(0, 0, 0.4);
    shipGroup.add(leftWing);

    const rightWing = new THREE.Mesh(wingGeom, wingMat);
    rightWing.rotation.x = Math.PI / 2;
    rightWing.scale.set(-1, 1, 1);
    rightWing.position.set(0, 0, 0.4);
    shipGroup.add(rightWing);

    // 翼尖霓虹发光线条
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xff007f, linewidth: 2 });
    const edgeGeom = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(2.8, 0, -1.2),
      new THREE.Vector3(2.2, 0, -1.8)
    ]);
    const leftEdge = new THREE.Line(edgeGeom, edgeMat);
    leftEdge.position.set(0, 0.05, 0.4);
    shipGroup.add(leftEdge);

    const rightEdge = new THREE.Line(edgeGeom, edgeMat);
    rightEdge.scale.set(-1, 1, 1);
    rightEdge.position.set(0, 0.05, 0.4);
    shipGroup.add(rightEdge);

    // 激光双炮管
    const cannonGeom = new THREE.CylinderGeometry(0.08, 0.08, 1.4, 8);
    cannonGeom.rotateX(Math.PI / 2);
    const cannonMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const leftCannon = new THREE.Mesh(cannonGeom, cannonMat);
    leftCannon.position.set(-1.4, -0.1, -0.2);
    const rightCannon = new THREE.Mesh(cannonGeom, cannonMat);
    rightCannon.position.set(1.4, -0.1, -0.2);
    shipGroup.add(leftCannon);
    shipGroup.add(rightCannon);

    // 引擎喷焰 (双色发光圆锥)
    const thrusterGeom = new THREE.ConeGeometry(0.35, 1.4, 8);
    thrusterGeom.rotateX(-Math.PI / 2);
    const thrusterMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const thruster = new THREE.Mesh(thrusterGeom, thrusterMat);
    thruster.position.set(0, 0, 2.2);
    shipGroup.add(thruster);

    scene.add(shipGroup);
    shipGroup.position.set(0, 0, 0);

    // ==========================================
    // 4. 曲率速度粒子流 (Speed Warp Lines)
    // ==========================================
    const warpCount = 350;
    const warpGeom = new THREE.BufferGeometry();
    const warpPositions = new Float32Array(warpCount * 6); // 每条线两端点

    for (let i = 0; i < warpCount; i++) {
      const x = (Math.random() - 0.5) * 60;
      const y = (Math.random() - 0.5) * 40 + 2;
      const z = -Math.random() * 250;
      const len = 4 + Math.random() * 8;
      warpPositions[i * 6 + 0] = x;
      warpPositions[i * 6 + 1] = y;
      warpPositions[i * 6 + 2] = z;
      warpPositions[i * 6 + 3] = x;
      warpPositions[i * 6 + 4] = y;
      warpPositions[i * 6 + 5] = z - len;
    }
    warpGeom.setAttribute('position', new THREE.BufferAttribute(warpPositions, 3));
    const warpMat = new THREE.LineBasicMaterial({
      color: 0x88ccff,
      transparent: true,
      opacity: 0.35
    });
    const warpLines = new THREE.LineSegments(warpGeom, warpMat);
    scene.add(warpLines);

    // ==========================================
    // 5. 障碍物与敌人系统 (Crystals & Drones)
    // ==========================================
    const obstacles = [];
    const obstacleGeoms = [
      new THREE.OctahedronGeometry(1.6, 0),
      new THREE.ConeGeometry(1.3, 5, 5),
      new THREE.DodecahedronGeometry(1.8, 0),
      new THREE.BoxGeometry(2, 6, 2)
    ];
    const obstacleColors = [0xff007f, 0x00ffff, 0xb300ff, 0xff0055];

    function spawnObstacle() {
      const geom = obstacleGeoms[Math.floor(Math.random() * obstacleGeoms.length)];
      const color = obstacleColors[Math.floor(Math.random() * obstacleColors.length)];
      const mat = new THREE.MeshStandardMaterial({
        color: 0x110520,
        emissive: color,
        emissiveIntensity: 0.9,
        wireframe: Math.random() > 0.4,
        roughness: 0.3
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 42,
        Math.random() * 14 - 1,
        -260
      );
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
      mesh.userData = {
        rotSpeedX: (Math.random() - 0.5) * 0.05,
        rotSpeedY: (Math.random() - 0.5) * 0.05,
        radius: 1.8,
        hp: 1
      };
      scene.add(mesh);
      obstacles.push(mesh);
    }

    // ==========================================
    // 6. 激光射击与爆炸粒子系统
    // ==========================================
    const lasers = [];
    const laserMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const laserGeom = new THREE.CylinderGeometry(0.12, 0.12, 4.5, 6);
    laserGeom.rotateX(Math.PI / 2);

    function shootLaser() {
      audio.playLaser();
      // 双管发射
      const offsets = [-1.4, 1.4];
      for (const ox of offsets) {
        const laser = new THREE.Mesh(laserGeom, laserMat);
        laser.position.copy(shipGroup.position);
        laser.position.x += ox;
        laser.position.z -= 1.5;
        scene.add(laser);
        lasers.push(laser);
      }
    }

    // 爆炸碎片池
    const particles = [];
    const pGeom = new THREE.BoxGeometry(0.2, 0.2, 0.2);

    function createExplosion(pos, colorHex = 0xff007f) {
      audio.playExplode();
      const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < 24; i++) {
        const p = new THREE.Mesh(pGeom, pMat);
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 0.8,
            (Math.random() - 0.5) * 0.8,
            (Math.random() - 0.5) * 0.8
          ),
          life: 30
        };
        scene.add(p);
        particles.push(p);
      }
    }

    // ==========================================
    // 7. 游戏状态与输入控制
    // ==========================================
    let isPlaying = false;
    let score = 0;
    let combo = 1;
    let shield = 100;
    let boostEnergy = 100;
    let isBoosting = false;
    let baseSpeed = 1.35;
    let currentSpeed = baseSpeed;
    let spawnTimer = 0;

    const keys = {};
    const mousePos = { x: 0, y: 0 };
    const targetShipPos = { x: 0, y: 0 };

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isPlaying) {
        shootLaser();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    window.addEventListener('mousemove', (e) => {
      mousePos.x = (e.clientX / window.innerWidth) * 2 - 1;
      mousePos.y = -(e.clientY / window.innerHeight) * 2 + 1;
      // 准星跟随
      const crosshair = document.getElementById('crosshair');
      crosshair.style.left = e.clientX + 'px';
      crosshair.style.top = e.clientY + 'px';
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0 && isPlaying) {
        shootLaser();
      }
    });

    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const shieldBar = document.getElementById('shield-bar');
    const boostBar = document.getElementById('boost-bar');
    const menuEl = document.getElementById('menu');
    const startBtn = document.getElementById('start-btn');
    const flashEl = document.getElementById('flash');

    function flashScreen(color = 'rgba(255, 0, 100, 0.4)') {
      flashEl.style.backgroundColor = color;
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 80);
    }

    function startGame() {
      audio.init();
      audio.startSynthwaveMusic();
      score = 0;
      combo = 1;
      shield = 100;
      boostEnergy = 100;
      isPlaying = true;
      menuEl.style.display = 'none';

      // 清理现有障碍物
      for (const obs of obstacles) scene.remove(obs);
      obstacles.length = 0;
      for (const l of lasers) scene.remove(l);
      lasers.length = 0;

      shipGroup.position.set(0, 0, 0);
    }

    function gameOver() {
      isPlaying = false;
      menuEl.style.display = 'block';
      menuEl.querySelector('.title').innerText = 'CRITICAL FAILURE';
      menuEl.querySelector('.subtitle').innerText = `最终巡航积分: ${score} · 连击峰值: x${combo}`;
      startBtn.innerText = '再次出击';
    }

    startBtn.addEventListener('click', startGame);

    // 屏幕适配
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==========================================
    // 8. 主渲染物理引擎循环 (60 FPS)
    // ==========================================
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (isPlaying) {
        // 加速模式判定 (Shift 或 W 键)
        isBoosting = (keys['ShiftLeft'] || keys['ShiftRight'] || keys['KeyW']) && boostEnergy > 0;
        if (isBoosting) {
          currentSpeed = baseSpeed * 2.2;
          boostEnergy = Math.max(0, boostEnergy - 0.7);
          camera.fov = THREE.MathUtils.lerp(camera.fov, 82, 0.08);
          warpMat.opacity = 0.85;
          thruster.scale.set(1.5, 2.5, 1.5);
          thrusterMat.color.setHex(0xff00ff);
        } else {
          currentSpeed = baseSpeed;
          boostEnergy = Math.min(100, boostEnergy + 0.25);
          camera.fov = THREE.MathUtils.lerp(camera.fov, 65, 0.06);
          warpMat.opacity = 0.35;
          thruster.scale.set(1, 1, 1);
          thrusterMat.color.setHex(0x00ffff);
        }
        camera.updateProjectionMatrix();

        // 键盘 / 鼠标双模输入融合
        let inputX = mousePos.x * 20;
        let inputY = mousePos.y * 10;
        if (keys['KeyA'] || keys['ArrowLeft']) inputX -= 12;
        if (keys['KeyD'] || keys['ArrowRight']) inputX += 12;
        if (keys['KeyS'] || keys['ArrowDown']) inputY -= 8;

        targetShipPos.x = THREE.MathUtils.clamp(inputX, -22, 22);
        targetShipPos.y = THREE.MathUtils.clamp(inputY, -2, 13);

        // 飞船平滑移动与炫酷姿态倾斜 (Roll & Pitch & Yaw)
        shipGroup.position.x = THREE.MathUtils.lerp(shipGroup.position.x, targetShipPos.x, 0.1);
        shipGroup.position.y = THREE.MathUtils.lerp(shipGroup.position.y, targetShipPos.y, 0.1);

        const deltaX = targetShipPos.x - shipGroup.position.x;
        const deltaY = targetShipPos.y - shipGroup.position.y;
        shipGroup.rotation.z = -deltaX * 0.12; // 侧倾 Bank
        shipGroup.rotation.x = deltaY * 0.08;  // 俯仰 Pitch
        shipGroup.rotation.y = -deltaX * 0.04;

        // 相机动态跟踪抖动
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, shipGroup.position.x * 0.35, 0.05);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, shipGroup.position.y * 0.3 + 3.2, 0.05);

        // 滚动网格与无缝循环
        gridHelper1.position.z += currentSpeed * 28 * delta;
        gridHelper2.position.z += currentSpeed * 28 * delta;
        if (gridHelper1.position.z > 200) gridHelper1.position.z -= 800;
        if (gridHelper2.position.z > 200) gridHelper2.position.z -= 800;

        // 曲率粒子更新
        const warpPosArr = warpGeom.attributes.position.array;
        for (let i = 0; i < warpCount; i++) {
          warpPosArr[i * 6 + 2] += currentSpeed * 90 * delta;
          warpPosArr[i * 6 + 5] += currentSpeed * 90 * delta;
          if (warpPosArr[i * 6 + 2] > 20) {
            warpPosArr[i * 6 + 2] = -240;
            warpPosArr[i * 6 + 5] = -240 - (4 + Math.random() * 8);
          }
        }
        warpGeom.attributes.position.needsUpdate = true;

        // 障碍物生成
        spawnTimer++;
        const currentSpawnRate = isBoosting ? 14 : 22;
        if (spawnTimer % currentSpawnRate === 0) {
          spawnObstacle();
        }

        // 障碍物更新与飞船碰撞
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += currentSpeed * 32 * delta;
          obs.rotation.x += obs.userData.rotSpeedX;
          obs.rotation.y += obs.userData.rotSpeedY;

          // 距离飞船的碰撞检测
          const distToShip = shipGroup.position.distanceTo(obs.position);
          if (distToShip < obs.userData.radius + 1.2) {
            // 撞击发生
            audio.playHit();
            flashScreen('rgba(255, 0, 50, 0.6)');
            createExplosion(obs.position, 0xff0055);
            scene.remove(obs);
            obstacles.splice(i, 1);

            shield -= 25;
            combo = 1;
            if (shield <= 0) {
              shield = 0;
              createExplosion(shipGroup.position, 0x00ffff);
              gameOver();
            }
            continue;
          }

          // 超出摄像机范围
          if (obs.position.z > 15) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
          }
        }

        // 激光弹道推进与命中检测
        for (let li = lasers.length - 1; li >= 0; li--) {
          const l = lasers[li];
          l.position.z -= 180 * delta;

          let hit = false;
          for (let oi = obstacles.length - 1; oi >= 0; oi--) {
            const obs = obstacles[oi];
            if (l.position.distanceTo(obs.position) < obs.userData.radius + 0.8) {
              // 击中爆裂
              createExplosion(obs.position, obs.material.emissive ? obs.material.emissive.getHex() : 0x00ffff);
              scene.remove(obs);
              obstacles.splice(oi, 1);

              score += 50 * combo;
              combo = Math.min(8, combo + 1);
              hit = true;
              break;
            }
          }

          if (hit || l.position.z < -280) {
            scene.remove(l);
            lasers.splice(li, 1);
          }
        }

        // 刷新 HUD 界面
        scoreEl.innerText = score;
        comboEl.innerText = 'x' + combo;
        shieldBar.style.width = shield + '%';
        boostBar.style.width = boostEnergy + '%';
      }

      // 爆炸碎块物理模拟
      for (let pi = particles.length - 1; pi >= 0; pi--) {
        const p = particles[pi];
        p.position.add(p.userData.vel);
        p.userData.life--;
        p.scale.multiplyScalar(0.94);
        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(pi, 1);
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
